name: Airspeed Sync

on:
  schedule:
    # Fires every 15 min across 06:00–20:59 UTC — a superset that covers the
    # 08:00–22:00 CET daytime window in both winter (UTC+1) and summer (UTC+2).
    # airspeed_sync.py then gates precisely on local CET time and weekday/weekend.
    - cron: "*/15 6-20 * * *"
  workflow_dispatch: {}

# GitHub throttles scheduled runs, so the job loops internally (see the run step)
# instead of relying on the cron to fire every few minutes. This guard lets a
# fresh scheduled start replace an in-progress loop rather than pile up behind it.
concurrency:
  group: airspeed-sync
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Airspeed sync (loops every 5 min through the working window)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GLYPHIC_API_KEY: ${{ secrets.GLYPHIC_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # Work every 5 min for up to ~2.75h, then exit. One long run with an
          # internal loop gives a reliable cadence despite GitHub throttling
          # scheduled starts. airspeed_sync.py still gates itself to CET work
          # hours, so iterations outside the window exit immediately.
          deadline=$(( SECONDS + 10200 ))   # ~170 minutes, safely under the 6h job cap
          while true; do
            python airspeed_sync.py || true
            if [ "$SECONDS" -ge "$deadline" ]; then break; fi
            sleep 300
          done
