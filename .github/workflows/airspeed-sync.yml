name: Airspeed Sync

on:
  schedule:
    # Fires every 15 min across 06:00–20:59 UTC — a superset that covers the
    # 08:00–22:00 CET daytime window in both winter (UTC+1) and summer (UTC+2).
    # airspeed_sync.py then gates precisely on local CET time and weekday/weekend.
    - cron: "*/15 6-20 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Airspeed sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GLYPHIC_API_KEY: ${{ secrets.GLYPHIC_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python airspeed_sync.py
