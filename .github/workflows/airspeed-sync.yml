name: Airspeed Sync

on:
  # Started by Google Cloud Scheduler (every 30 min) via a workflow_dispatch API
  # call — GitHub's own cron is throttled and clusters runs 1–2h apart, so we
  # don't rely on it. Also runnable manually from the Actions tab.
  workflow_dispatch: {}

# Safety guard: if a run ever overruns into the next trigger, replace it rather
# than pile up. Normally each run self-exits (see the deadline in the run step)
# before the next trigger, so this rarely fires.
concurrency:
  group: airspeed-sync
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Airspeed sync (loops every 90s through the working window)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GLYPHIC_API_KEY: ${{ secrets.GLYPHIC_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # Poll Airspeed every 90s, then exit cleanly. The deadline is sized to
          # finish just before the next Cloud Scheduler trigger (every 30 min),
          # so each run ends green instead of being cancelled mid-loop. If you
          # change the Cloud Scheduler interval, adjust this to match.
          # airspeed_sync.py gates itself to CET work hours, so iterations
          # outside the window exit immediately.
          deadline=$(( SECONDS + 1680 ))    # ~28 minutes (< the 30-min trigger interval)
          while true; do
            python airspeed_sync.py || true
            if [ "$SECONDS" -ge "$deadline" ]; then break; fi
            sleep 90
          done

  # Sends the notetaker to meetings OTHER companies organize (their invites
  # never include support@dobby.io, so Airspeed can't auto-join them). Runs in
  # parallel with the summary loop and polls every 60s for the same ~28 min.
  notetaker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write             # REQUIRED — WIF token for keyless Google auth
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Authenticate to Google (keyless, via Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/975330914917/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "meeting-sync@dobby-workspace-automations.iam.gserviceaccount.com"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run notetaker dispatch (polls every 60s through the window)
        env:
          GLYPHIC_API_KEY: ${{ secrets.GLYPHIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CALENDAR_USERS: ${{ vars.CALENDAR_USERS }}
          USER_SOURCE: ${{ vars.USER_SOURCE }}
          DIRECTORY_ADMIN: ${{ vars.DIRECTORY_ADMIN }}
          USER_EXCLUDE: ${{ vars.USER_EXCLUDE }}
          # Optional: comma-separated subset to pin the dispatch to.
          NOTETAKER_USERS: ${{ vars.NOTETAKER_USERS }}
          # Safety: stays in dry-run (sends nothing) unless the repo variable
          # NOTETAKER_DRY_RUN is set to "false".
          DRY_RUN: ${{ vars.NOTETAKER_DRY_RUN || 'true' }}
          # Dobby-hosted meetings that start without support@ on the invite (e.g.
          # created at the last minute): preview until NOTETAKER_DOBBY_HOSTED_DRY_RUN
          # is set to "false".
          DOBBY_HOSTED_DRY_RUN: ${{ vars.NOTETAKER_DOBBY_HOSTED_DRY_RUN || 'true' }}
          RUN_SECONDS: "1680"         # ~28 min, < the 30-min Cloud Scheduler trigger
        run: python notetaker_dispatch.py
