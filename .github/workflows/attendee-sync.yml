
name: Attendee Sync

on:
  schedule:
    - cron: "*/15 6-20 * * *"   # every 15 min across the working day (best-effort)
  workflow_dispatch: {}         # run manually from the Actions tab

permissions:
  contents: read
  id-token: write               # REQUIRED — lets the job get a WIF token from GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Authenticate to Google (keyless, via Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/975330914917/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "meeting-sync@dobby-workspace-automations.iam.gserviceaccount.com"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run attendee sync
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CALENDAR_USERS: ${{ vars.CALENDAR_USERS }}
          # Optional pilot override — a comma-separated subset. Unset = use CALENDAR_USERS.
          ATTENDEE_SYNC_USERS: ${{ vars.ATTENDEE_SYNC_USERS }}
          # Set USER_SOURCE=directory to cover ALL active Workspace users (needs
          # the admin.directory.user.readonly DWD scope). Overrides the lists above.
          USER_SOURCE: ${{ vars.USER_SOURCE }}
          DIRECTORY_ADMIN: ${{ vars.DIRECTORY_ADMIN }}
          USER_EXCLUDE: ${{ vars.USER_EXCLUDE }}
          # Safety: stays in dry-run (writes nothing) unless you set the repo
          # variable ATTENDEE_SYNC_DRY_RUN to "false".
          DRY_RUN: ${{ vars.ATTENDEE_SYNC_DRY_RUN || 'true' }}
        run: python attendee_sync.py
